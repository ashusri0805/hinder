<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hinder - Halal Swipes</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="mobile-frame">
    <!-- Header -->
    <header class="navbar">
      <button class="nav-btn"><i class="fa-solid fa-user"></i></button>
      <h1 class="logo"><i class="fa-solid fa-moon"></i> Hinder</h1>
      <button class="nav-btn"><i class="fa-solid fa-comments"></i></button>
    </header>

    <!-- Card Stack Container -->
    <main class="card-deck" id="cardDeck">
      <!-- Cards will be populated by JavaScript -->
    </main>

    <!-- Action Buttons -->
    <footer class="action-bar">
      <button class="action-btn rewind" onclick="handleAction('rewind')">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button class="action-btn pass" onclick="handleAction('pass')">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <button class="action-btn superlike" onclick="handleAction('star')">
        <i class="fa-solid fa-star"></i>
      </button>
      <button class="action-btn like" onclick="handleAction('like')">
        <i class="fa-solid fa-heart"></i>
      </button>
      <button class="action-btn boost" onclick="handleAction('boost')">
        <i class="fa-solid fa-bolt"></i>
      </button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
